<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800">
  <defs>
    <!-- Background styling -->
    <style>
      .bg { fill: #1e1e2e; }
      .box { fill: #313244; stroke: #89b4fa; stroke-width: 2; rx: 8; ry: 8; }
      .db { fill: #313244; stroke: #f9e2af; stroke-width: 2; rx: 20; ry: 20; }
      .external { fill: #313244; stroke: #f38ba8; stroke-width: 2; rx: 8; ry: 8; stroke-dasharray: 5,5; }
      .title { fill: #cdd6f4; font-family: 'Segoe UI', Arial, sans-serif; font-size: 24px; font-weight: bold; }
      .text { fill: #cdd6f4; font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; text-anchor: middle; }
      .text-small { fill: #a6adc8; font-family: 'Segoe UI', Arial, sans-serif; font-size: 12px; text-anchor: middle; }
      .text-bold { fill: #89b4fa; font-family: 'Segoe UI', Arial, sans-serif; font-size: 14px; font-weight: bold; text-anchor: middle; }
      .line { stroke: #6c7086; stroke-width: 2; fill: none; }
      .line-dashed { stroke: #6c7086; stroke-width: 2; fill: none; stroke-dasharray: 5,5; }
      .arrow { fill: #6c7086; }
    </style>
    
    <!-- Arrowhead markers -->
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="arrow" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" class="bg" />
  
  <!-- Title -->
  <text x="600" y="50" class="title" text-anchor="middle">Self-Healing RAG Architecture</text>

  <!-- ================= INGESTION PIPELINE (Bottom) ================= -->
  <g transform="translate(100, 650)">
    <rect width="1000" height="120" fill="#181825" stroke="#45475a" stroke-width="2" rx="10" ry="10" />
    <text x="500" y="25" class="text-bold" fill="#a6e3a1">DOCUMENT INGESTION PIPELINE</text>
  </g>

  <!-- Ingestion Nodes -->
  <g transform="translate(150, 690)">
    <rect width="140" height="60" class="box" />
    <text x="70" y="25" class="text-bold">Raw Documents</text>
    <text x="70" y="45" class="text-small">PDFs / Text</text>
  </g>
  
  <g transform="translate(370, 690)">
    <rect width="140" height="60" class="box" />
    <text x="70" y="25" class="text-bold">Document Parser</text>
    <text x="70" y="45" class="text-small">pyPDF + Splitter</text>
  </g>

  <g transform="translate(590, 690)">
    <rect width="160" height="60" class="box" />
    <text x="80" y="25" class="text-bold">Embedding Model</text>
    <text x="80" y="45" class="text-small">bge-small-en-v1.5</text>
  </g>

  <g transform="translate(830, 690)">
    <rect width="140" height="60" class="db" />
    <text x="70" y="25" class="text-bold">FAISS VectorDB</text>
    <text x="70" y="45" class="text-small">Index Storage</text>
  </g>

  <!-- Ingestion Arrows -->
  <path d="M 290 720 L 355 720" class="line" marker-end="url(#arrowhead)" />
  <path d="M 510 720 L 575 720" class="line" marker-end="url(#arrowhead)" />
  <path d="M 750 720 L 815 720" class="line" marker-end="url(#arrowhead)" />
  <!-- Arrow from FAISS to Central DB -->
  <path d="M 900 690 L 900 610 L 750 610 L 750 495" class="line-dashed" marker-end="url(#arrowhead)" />

  <!-- ================= CENTRAL VECTOR DB ================= -->
  <g transform="translate(680, 420)">
    <rect width="140" height="70" class="db" />
    <text x="70" y="30" class="text-bold" fill="#f9e2af">FAISS</text>
    <text x="70" y="50" class="text-small">Knowledge Base</text>
  </g>

  <!-- ================= QUERY PIPELINE ================= -->
  
  <!-- User / Frontend -->
  <g transform="translate(50, 420)">
    <rect width="120" height="60" class="box" />
    <text x="60" y="25" class="text-bold">User / Frontend</text>
    <text x="60" y="45" class="text-small">Query input</text>
  </g>

  <!-- API Server -->
  <g transform="translate(220, 420)">
    <rect width="120" height="60" class="box" />
    <text x="60" y="25" class="text-bold">API Server</text>
    <text x="60" y="45" class="text-small">FastAPI</text>
  </g>

  <!-- Intent Analyzer -->
  <g transform="translate(390, 420)">
    <rect width="140" height="60" class="box" />
    <text x="70" y="25" class="text-bold">Intent Analyzer</text>
    <text x="70" y="45" class="text-small">Global vs QA</text>
  </g>

  <!-- QA PATH (Top) -->
  <g transform="translate(390, 150)">
    <rect width="700" height="230" fill="#181825" stroke="#45475a" stroke-width="2" rx="10" ry="10" />
    <text x="350" y="25" class="text-bold" fill="#a6e3a1">QA RETRIEVAL PIPELINE (Intent = QA)</text>
  </g>

  <!-- Query Decomposer -->
  <g transform="translate(420, 200)">
    <rect width="140" height="60" class="box" />
    <text x="70" y="25" class="text-bold">Query Decomposer</text>
    <text x="70" y="45" class="text-small">Splits complex queries</text>
  </g>

  <!-- HyDE -->
  <g transform="translate(600, 200)">
    <rect width="140" height="60" class="box" />
    <text x="70" y="25" class="text-bold">HyDE Retriever</text>
    <text x="70" y="45" class="text-small">Hypothetical Docs</text>
  </g>

  <!-- FAISS Retrieval Node -->
  <g transform="translate(600, 300)">
    <rect width="140" height="50" class="box" />
    <text x="70" y="30" class="text-bold">Similarity Search</text>
  </g>

  <!-- CRAG -->
  <g transform="translate(780, 200)">
    <rect width="140" height="60" class="box" />
    <text x="70" y="25" class="text-bold">CRAG Validator</text>
    <text x="70" y="45" class="text-small">Relevance Grader</text>
  </g>

  <!-- Web Search Fallback -->
  <g transform="translate(780, 100)">
    <rect width="140" height="50" class="external" />
    <text x="70" y="30" class="text-bold" fill="#f38ba8">Tavily Web Search</text>
  </g>

  <!-- Cross-Encoder -->
  <g transform="translate(930, 250)">
    <rect width="140" height="60" class="box" />
    <text x="70" y="25" class="text-bold">Cross-Encoder</text>
    <text x="70" y="45" class="text-small">Reranking</text>
  </g>


  <!-- GLOBAL REVIEW PATH -->
  <!-- Direct arrow text -->
  <text x="530" y="480" class="text-small" fill="#f9e2af">Global Review Route (Skips QA Pipeline)</text>


  <!-- GENERATION & LEARNING -->
  <!-- Dynamic Prompting -->
  <g transform="translate(930, 520)">
    <rect width="140" height="60" class="box" />
    <text x="70" y="25" class="text-bold">Learning Mgr</text>
    <text x="70" y="45" class="text-small">Dynamic Few-Shot</text>
  </g>

  <!-- Generator LLM -->
  <g transform="translate(930, 420)">
    <rect width="140" height="60" class="box" />
    <text x="70" y="25" class="text-bold">Generator LLM</text>
    <text x="70" y="45" class="text-small">Llama 3.1 8B</text>
  </g>

  <!-- ================= ARROWS ================= -->

  <!-- User -> API -> Intent -->
  <path d="M 170 450 L 205 450" class="line" marker-end="url(#arrowhead)" />
  <path d="M 340 450 L 375 450" class="line" marker-end="url(#arrowhead)" />

  <!-- Intent -> QA Pipeline -->
  <path d="M 460 420 L 460 275" class="line" marker-end="url(#arrowhead)" />
  <text x="470" y="350" class="text-small">If QA</text>
  
  <!-- Intent -> Global Review (Direct to FAISS) -->
  <path d="M 530 460 L 665 460" class="line" marker-end="url(#arrowhead)" />
  
  <!-- Global Review -> Generator LLM -->
  <path d="M 820 460 L 915 460" class="line" marker-end="url(#arrowhead)" />

  <!-- QA Pipeline Internal Routing -->
  <!-- Decomposer -> HyDE -->
  <path d="M 560 230 L 585 230" class="line" marker-end="url(#arrowhead)" />
  
  <!-- HyDE -> Similarity Search -->
  <path d="M 670 260 L 670 285" class="line" marker-end="url(#arrowhead)" />
  
  <!-- FAISS DB -> Similarity Search -->
  <path d="M 750 420 L 750 325 L 755 325" class="line-dashed" />
  
  <!-- Similarity Search -> CRAG -->
  <path d="M 740 325 L 850 325 L 850 275" class="line" marker-end="url(#arrowhead)" />
  
  <!-- CRAG -> Web Search -->
  <path d="M 850 200 L 850 165" class="line-dashed" marker-end="url(#arrowhead)" />
  <text x="890" y="185" class="text-small">Fallback</text>
  
  <!-- CRAG -> Reranker -->
  <path d="M 920 230 L 1000 230 L 1000 235" class="line" marker-end="url(#arrowhead)" />
  
  <!-- Reranker -> Generator LLM -->
  <path d="M 1000 310 L 1000 405" class="line" marker-end="url(#arrowhead)" />

  <!-- Learning Manager -> Generator LLM -->
  <path d="M 1000 520 L 1000 495" class="line-dashed" marker-end="url(#arrowhead)" />
  <text x="1055" y="510" class="text-small">Few-Shot Context</text>

  <!-- Generator LLM -> API Server -->
  <path d="M 1000 480 L 1000 580 L 280 580 L 280 495" class="line" marker-end="url(#arrowhead)" />
  <text x="640" y="570" class="text-bold" fill="#a6e3a1">Generated Answer Response</text>

</svg>
